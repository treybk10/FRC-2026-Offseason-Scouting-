name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet httpx2

      - name: Generate api_keys.py from repository secrets
        run: |
          cat > my-app/src/api_keys.py << 'PYEOF'
          # This file is generated from GitHub repository secrets during CI.
          # It is NOT tracked in version control (see .gitignore).
          TBA_API_KEY = "${{ secrets.TBA_API_KEY }}"
          GOOGLE_SHEETS_SPREADSHEET_ID = "${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}"
          GOOGLE_SHEETS_RANGE = "${{ secrets.GOOGLE_SHEETS_RANGE }}"
          GOOGLE_SERVICE_ACCOUNT_INFO = ${{ secrets.GOOGLE_SERVICE_ACCOUNT_INFO }}
          PYEOF

      - name: Build Web App
        run: |
          flet build web my-app/src --base-url /FRC-2026-Offseason-Scouting-/ --output build/web --yes

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
