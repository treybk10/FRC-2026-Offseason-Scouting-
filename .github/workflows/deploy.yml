name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r my-app/src/requirements.txt

      - name: Generate api_keys.py from repository secrets
        env:
          TBA_API_KEY: ${{ secrets.TBA_API_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_RANGE: ${{ secrets.GOOGLE_SHEETS_RANGE }}
          GOOGLE_SERVICE_ACCOUNT_INFO: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_INFO }}
        run: |
          python3 << 'EOF'
          import json
          import os

          # Read secrets from environment variables (GitHub Actions injects them)
          tba_key = os.environ['TBA_API_KEY']
          spreadsheet_id = os.environ['GOOGLE_SHEETS_SPREADSHEET_ID']
          sheets_range = os.environ['GOOGLE_SHEETS_RANGE']
          service_account_str = os.environ['GOOGLE_SERVICE_ACCOUNT_INFO'].strip()

          # Strip markdown code fences if present (common paste mistake)
          if service_account_str.startswith('```'):
              service_account_str = service_account_str.split('\n', 1)[1]
          if service_account_str.endswith('```'):
              service_account_str = service_account_str.rsplit('\n', 1)[0]
          service_account_str = service_account_str.strip()

          try:
              service_account = json.loads(service_account_str)
          except json.JSONDecodeError as err:
              raise SystemExit(
                  f'GOOGLE_SERVICE_ACCOUNT_INFO secret is not valid JSON: {err}\n'
                  'Paste the full service-account JSON key file from Google Cloud '
                  '(should start with "{" and end with "}")'
              )

          # Normalize keys pasted with either escaped or literal line breaks.
          private_key = service_account.get('private_key')
          if isinstance(private_key, str):
              private_key = (
                  private_key.replace('\\\\n', '\n')
                  .replace('\\n', '\n')
                  .replace('\\r\\n', '\n')
                  .replace('\\r', '\n')
                  .strip()
              )
              service_account['private_key'] = private_key
          else:
              raise SystemExit(
                  'GOOGLE_SERVICE_ACCOUNT_INFO is missing a string private_key field.'
              )
          if not (
              private_key.startswith('-----BEGIN ')
              and 'PRIVATE KEY-----' in private_key.split('\n', 1)[0]
              and private_key.rstrip().endswith('-----')
          ):
              raise SystemExit(
                  'GOOGLE_SERVICE_ACCOUNT_INFO private_key is not a PEM private key. '
                  'Use the complete JSON key downloaded from Google Cloud.'
              )

          required_fields = (
              'project_id', 'private_key_id', 'client_email', 'client_id', 'token_uri'
          )
          missing = [field for field in required_fields if not service_account.get(field)]
          if missing:
              raise SystemExit(
                  'GOOGLE_SERVICE_ACCOUNT_INFO is missing required fields: '
                  + ', '.join(missing)
              )

          with open('my-app/src/api_keys.py', 'w') as f:
              f.write('# This file is generated from GitHub repository secrets during CI.\n')
              f.write('# It is NOT tracked in version control (see .gitignore).\n\n')
              f.write(f'TBA_API_KEY = {json.dumps(tba_key)}\n')
              f.write(f'GOOGLE_SHEETS_SPREADSHEET_ID = {json.dumps(spreadsheet_id)}\n')
              f.write(f'GOOGLE_SHEETS_RANGE = {json.dumps(sheets_range)}\n')
              f.write(f'GOOGLE_SERVICE_ACCOUNT_INFO = {json.dumps(service_account)}\n')
          EOF

      - name: Build Web App
        run: |
          flet build web my-app/src --base-url /FRC-2026-Offseason-Scouting-/ --output build/web --yes

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4